<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>几何配图</title></head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#fff">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 580" width="420" height="580">
  <!-- 三角形 ABC -->
  <polygon points="200,70 50,300 350,300" fill="none" stroke="#000" stroke-width="2"/>
  <!-- 中线 AD（虚线） -->
  <line x1="200" y1="70" x2="200" y2="300" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- 延长线 DE（虚线） -->
  <line x1="200" y1="300" x2="200" y2="520" stroke="#000" stroke-width="1.5" stroke-dasharray="6,3"/>
  <!-- BE -->
  <line x1="50" y1="300" x2="200" y2="520" stroke="#000" stroke-width="1.5"/>
  <!-- 顶点 -->
  <circle cx="200" cy="70" r="3" fill="#000"/>
  <text x="200" y="50" text-anchor="middle" font-size="18" font-style="italic">A</text>
  <circle cx="50" cy="300" r="3" fill="#000"/>
  <text x="50" y="325" text-anchor="middle" font-size="18" font-style="italic">B</text>
  <circle cx="350" cy="300" r="3" fill="#000"/>
  <text x="350" y="325" text-anchor="middle" font-size="18" font-style="italic">C</text>
  <circle cx="200" cy="300" r="3" fill="#000"/>
  <text x="200" y="320" text-anchor="middle" font-size="16" font-style="italic">D</text>
  <circle cx="200" cy="520" r="3" fill="#000"/>
  <text x="200" y="545" text-anchor="middle" font-size="18" font-style="italic">E</text>
  <!-- 等长标记：AD = DE -->
  <text x="208" y="200" font-size="14">|</text>
  <text x="208" y="410" font-size="14">|</text>
  <!-- 等长标记：BD = DC -->
  <text x="125" y="310" font-size="14">||</text>
  <text x="275" y="310" font-size="14">||</text>
  <!-- 对顶角标记 -->
  <path d="M 190,290 A 14,14 0 0,0 200,286" fill="none" stroke="#000" stroke-width="1"/>
  <path d="M 210,310 A 14,14 0 0,0 200,314" fill="none" stroke="#000" stroke-width="1"/>
  <!-- 图题 -->
  <text x="210" y="580" text-anchor="middle" font-size="14">第10题图</text>
</svg>
</body>
</html>
