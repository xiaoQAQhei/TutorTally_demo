<h2>课记 — 极简图标</h2>
<p class="subtitle">每个方案不超过 3 个视觉元素，粗线条，能在 48px 桌面上一眼辨认。底色统一用 app 主色 #6366f1。</p>

<div class="section">
  <div class="cards">

    <!-- 1. 单一大对勾 -->
    <div class="card" data-choice="min-check">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <polyline points="22,52 42,72 78,28" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>1. 对勾</h3><p>一个元素。划掉的满足感。</p></div>
    </div>

    <!-- 2. 对勾内嵌人形 -->
    <div class="card" data-choice="min-check-person">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <polyline points="20,50 40,70 80,26" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="46" cy="44" r="7" fill="white"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>2. 对勾+圆点</h3><p>对勾+一个圆点。「划掉的是关于人的记录」。</p></div>
    </div>

    <!-- 3. 粗体K -->
    <div class="card" data-choice="min-k">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <line x1="34" y1="20" x2="34" y2="80" stroke="white" stroke-width="10" stroke-linecap="round"/>
            <polyline points="66,20 34,52 66,80" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>3. K</h3><p>一个字母。课记首字母，两条线。</p></div>
    </div>

    <!-- 4. 人形+对勾 并排 -->
    <div class="card" data-choice="min-person-check">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <circle cx="30" cy="36" r="9" fill="none" stroke="white" stroke-width="5"/>
            <path d="M16,74 L16,54 Q30,48 44,54 L44,74" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
            <polyline points="60,44 68,56 84,34" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>4. 人+对勾</h3><p>左边人形=学生，右边对勾=记录完成。</p></div>
    </div>

    <!-- 5. 纸+对勾 -->
    <div class="card" data-choice="min-page-check">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <rect x="24" y="16" width="52" height="68" rx="4" fill="none" stroke="white" stroke-width="5"/>
            <polygon points="66,16 66,34 76,34" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
            <polygon points="66,16 66,34 76,34" fill="rgba(255,255,255,.25)"/>
            <polyline points="40,56 48,66 64,46" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>5. 纸+对勾</h3><p>折角便签+一个对勾。课=纸上记录。</p></div>
    </div>

    <!-- 6. 竖线+圆点 = 正字·人 -->
    <div class="card" data-choice="min-tally">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <line x1="36" y1="22" x2="36" y2="78" stroke="white" stroke-width="8" stroke-linecap="round"/>
            <line x1="64" y1="22" x2="64" y2="78" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
            <circle cx="36" cy="12" r="5" fill="white"/>
            <circle cx="64" cy="12" r="5" fill="white" opacity="0.3"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>6. 正字·人</h3><p>两条竖线=正字计数。上方两点=学生。</p></div>
    </div>

    <!-- 7. 横线+对勾 -->
    <div class="card" data-choice="min-line-check">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <line x1="24" y1="44" x2="70" y2="44" stroke="white" stroke-width="6" stroke-linecap="round"/>
            <polyline points="44,40 54,54 76,28" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>7. 横线+对勾</h3><p>一条横线=待办条目。对勾起笔于横线=划掉。</p></div>
    </div>

    <!-- 8. 圆环+点 -->
    <div class="card" data-choice="min-circle">
      <div class="card-image" style="padding:20px;display:flex;align-items:center;justify-content:center;background:#f0f0f5;">
        <div style="width:140px;height:140px;border-radius:32px;background:#6366f1;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(99,102,241,.3);">
          <svg viewBox="0 0 100 100" width="70" height="70">
            <path d="M24,42 C24,24 44,16 60,16 C74,16 82,28 82,48" stroke="white" stroke-width="8" fill="none" stroke-linecap="round"/>
            <circle cx="22" cy="46" r="6" fill="white"/>
          </svg>
        </div>
      </div>
      <div class="card-body"><h3>8. 圆·人</h3><p>未闭合的环=课程，圆点=学生。缺口=未完。</p></div>
    </div>

  </div>
</div>
