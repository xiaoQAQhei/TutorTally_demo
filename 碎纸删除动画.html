<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>碎纸机删除 · 圆角卡片切碎版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    .demo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 100%;
      max-width: 420px;
    }

    /* 卡片容器 - 圆角 */
    .card {
      position: relative;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 30px 45px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: visible;
      transition: opacity 0.25s;
    }

    .card-content {
      transition: opacity 0.15s;
    }

    .card-content.hidden {
      opacity: 0;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .icon-placeholder {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #e9d5ff, #c084fc);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #4a1d8c;
      box-shadow: 0 8px 14px rgba(168, 85, 247, 0.3);
      flex-shrink: 0;
    }

    .file-info h3 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1e1b4b;
      margin-bottom: 4px;
    }

    .file-info span {
      font-size: 0.9rem;
      color: #64748b;
    }

    .content-preview {
      background: #f8fafc;
      border-radius: 18px;
      padding: 18px;
      margin: 16px 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      background: white;
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 0.9rem;
      color: #334155;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      border: 1px solid #e2e8f0;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
    }

    .shred-btn {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 20px -10px rgba(79, 70, 229, 0.5);
      transition: all 0.25s;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .shred-btn:hover {
      background: linear-gradient(135deg, #312e81, #4338ca);
      transform: scale(1.02);
    }

    .shred-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      transform: none;
    }

    .reset-btn {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #e2e8f0;
      padding: 12px 30px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: rgba(255,255,255,0.18);
      color: white;
    }

    .hint-text {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    /* 碎纸条 */
    .shred-strip {
      position: absolute;
      top: 0;
      height: 100%;
      overflow: hidden;
      z-index: 30;
      pointer-events: none;
      border-radius: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .strip-inner {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      pointer-events: none;
      border-radius: 0;
    }
  </style>
</head>
<body>
  <div class="demo-wrapper">
    <div id="documentCard" class="card">
      <div id="cardContent" class="card-content">
        <div class="file-meta">
          <div class="icon-placeholder">📄</div>
          <div class="file-info">
            <h3>季度报告_终稿.pdf</h3>
            <span>2.4 MB · 昨天修改</span>
          </div>
        </div>
        <div class="content-preview">
          <span class="badge">财务分析</span>
          <span class="badge">市场趋势</span>
          <span class="badge">团队总结</span>
        </div>
        <div class="action-row">
          <button id="shredButton" class="shred-btn">🗑️ 碎纸删除</button>
        </div>
      </div>
    </div>
    <div>
      <button id="resetButton" class="reset-btn">↺ 重新生成文档</button>
      <div class="hint-text">圆角卡片被切碎掉落</div>
    </div>
  </div>

  <script>
    (function() {
      const card = document.getElementById('documentCard');
      const cardContent = document.getElementById('cardContent');
      const shredBtn = document.getElementById('shredButton');
      const resetBtn = document.getElementById('resetButton');

      const STRIP_COUNT = 8;
      const ANIMATION_DURATION = 700;

      let activeStrips = [];

      function cloneCardContent() {
        const clone = card.cloneNode(true);
        clone.style.position = 'absolute';
        clone.style.top = '0';
        clone.style.left = '0';
        clone.style.width = card.offsetWidth + 'px';
        clone.style.height = card.offsetHeight + 'px';
        clone.style.margin = '0';
        clone.style.boxShadow = 'none';
        clone.style.borderRadius = '28px';
        clone.style.overflow = 'hidden';
        clone.style.padding = '0';
        const clonedBtn = clone.querySelector('#shredButton');
        if (clonedBtn) clonedBtn.remove();
        const innerContent = clone.querySelector('.card-content');
        if (innerContent) {
          innerContent.style.padding = '28px 24px';
        }
        return clone;
      }

      function generateWidths(count) {
        return Array.from({ length: count }, () => 100 / count);
      }

      function createStripInner(cloneTemplate, stripIndex, stripWidthPercent) {
        const cardWidth = card.offsetWidth;
        const cardHeight = card.offsetHeight;

        const wrapper = document.createElement('div');
        wrapper.className = 'strip-inner';
        wrapper.style.position = 'absolute';
        wrapper.style.top = '0';
        wrapper.style.left = '0';
        const stripWidthPx = cardWidth * (stripWidthPercent / 100);
        wrapper.style.width = stripWidthPx + 'px';
        wrapper.style.height = cardHeight + 'px';
        wrapper.style.overflow = 'hidden';
        wrapper.style.borderRadius = '0';

        const innerClone = cloneTemplate.cloneNode(true);
        innerClone.style.position = 'absolute';
        innerClone.style.top = '0';
        const offsetX = cardWidth * (stripIndex * stripWidthPercent / 100);
        innerClone.style.left = '-' + offsetX + 'px';
        innerClone.style.width = cardWidth + 'px';
        innerClone.style.height = cardHeight + 'px';
        wrapper.appendChild(innerClone);

        return wrapper;
      }

      async function runAnimation() {
        shredBtn.disabled = true;

        const cardWidth = card.offsetWidth;
        const cardHeight = card.offsetHeight;

        const cloneTemplate = cloneCardContent();
        const widths = generateWidths(STRIP_COUNT);

        cardContent.classList.add('hidden');

        activeStrips = [];
        let leftAcc = 0;

        widths.forEach((widthPercent, i) => {
          const strip = document.createElement('div');
          strip.className = 'shred-strip';
          strip.style.position = 'absolute';
          strip.style.top = '0';
          strip.style.left = leftAcc + '%';
          strip.style.width = widthPercent + '%';
          strip.style.height = cardHeight + 'px';
          strip.style.overflow = 'hidden';
          strip.style.borderRadius = '0';

          const inner = createStripInner(cloneTemplate, i, widthPercent);
          strip.appendChild(inner);

          card.appendChild(strip);
          activeStrips.push({ el: strip, left: leftAcc, width: widthPercent, index: i });
          leftAcc += widthPercent;
        });

        card.offsetHeight;

        const animations = activeStrips.map((item, index) => {
          const el = item.el;
          const delay = Math.random() * 80 + index * 20;
          const fallDistance = cardHeight * (0.6 + Math.random() * 0.7);
          const rotate = (Math.random() - 0.5) * 30;
          const driftX = (Math.random() - 0.5) * 25;

          const keyframes = [
            {
              transform: 'translateY(0) translateX(0) rotate(0deg)',
              opacity: 1,
              offset: 0
            },
            {
              transform: `translateY(${fallDistance * 0.6}px) translateX(${driftX * 0.5}px) rotate(${rotate * 0.5}deg)`,
              opacity: 0.85,
              offset: 0.55
            },
            {
              transform: `translateY(${fallDistance}px) translateX(${driftX}px) rotate(${rotate}deg)`,
              opacity: 0,
              offset: 1
            }
          ];

          const animation = el.animate(keyframes, {
            duration: ANIMATION_DURATION,
            delay: delay,
            fill: 'forwards',
            easing: 'cubic-bezier(0.32, 0, 0.67, 0.95)'
          });

          return animation.finished;
        });

        await Promise.all(animations);

        cleanupStrips();
        card.style.opacity = '0';
      }

      function cleanupStrips() {
        activeStrips.forEach(item => {
          if (item.el.parentNode) {
            item.el.remove();
          }
        });
        activeStrips = [];
      }

      function reset() {
        cleanupStrips();
        card.style.opacity = '1';
        cardContent.classList.remove('hidden');
        shredBtn.disabled = false;
      }

      shredBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (shredBtn.disabled) return;
        runAnimation();
      });

      resetBtn.addEventListener('click', reset);

      reset();
    })();
  </script>
</body>
</html>
